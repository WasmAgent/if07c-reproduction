name: Release Candidate Audit (Pre-Tag Gate)

# This workflow is the ONLY authorized path to tag a release.
# Run it manually with the candidate SHA before creating any tag.
# Success means the candidate MAY be tagged — it does NOT create the tag.
# The human maintainer must review artifacts and create the tag manually.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact commit SHA of the release candidate'
        required: true
      intended_tag:
        description: 'Intended tag (e.g., v1.0.2) — informational only, no tag is created'
        required: true

jobs:
  release-candidate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify HEAD matches candidate SHA
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.inputs.candidate_sha }}"
          if [[ "$ACTUAL_HEAD" != "$EXPECTED" ]]; then
            echo "FATAL: HEAD $ACTUAL_HEAD does not match candidate_sha $EXPECTED"
            exit 1
          fi
          echo "HEAD verified: $ACTUAL_HEAD"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record candidate identity
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, platform
          import os
          d = {
            'format': 'if07c-candidate-identity/v1',
            'candidate_commit': os.environ['CANDIDATE_SHA'],
            'tree_sha': subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip(),
            'intended_tag': os.environ['INTENDED_TAG'],
            'node': subprocess.check_output(['node','--version']).decode().strip(),
            'npm': subprocess.check_output(['npm','--version']).decode().strip(),
            'os': platform.platform(),
          }
          json.dump(d, open('candidate-identity.json','w'), indent=2)
          print(json.dumps(d, indent=2))
          PYEOF
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          INTENDED_TAG: ${{ github.event.inputs.intended_tag }}

      - name: Run prepublish audit
        id: prepublish_audit
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/prepublish-audit.mjs \
            --git-ref ${{ github.event.inputs.candidate_sha }} \
            2>&1 | tee audit-output.txt

      - name: Run outsider rehearsal
        id: outsider_rehearsal
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/outsider-repro.sh \
            --commit-only ${{ github.event.inputs.candidate_sha }} \
            2>&1 | tee outsider-rehearsal-output.txt

      - name: Produce release-candidate verdict
        env:
          AUDIT_OUTCOME: ${{ steps.prepublish_audit.outcome }}
          REHEARSAL_OUTCOME: ${{ steps.outsider_rehearsal.outcome }}
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          INTENDED_TAG: ${{ github.event.inputs.intended_tag }}
        run: |
          python3 - <<'PYEOF'
          import json, re, os

          def parse_section(text, sec_id):
              m = re.search(r'\[' + re.escape(sec_id) + r'\].*?(?=\n\[[A-Z]\]|\Z)', text, re.DOTALL)
              if not m:
                  return 'FAIL'
              section = m.group(0)
              if 'SKIPPED' in section and '  FAIL  ' not in section and '  PASS  ' not in section:
                  return 'SKIPPED'
              return 'FAIL' if '  FAIL  ' in section else 'PASS'

          def parse_registry(text):
              m = re.search(r'\[C\].*?(?=\n\[[A-Z]\]|\Z)', text, re.DOTALL)
              if not m:
                  return 'FAIL'
              c_text = m.group(0)
              if 'SKIPPED' in c_text and '  PASS  ' not in c_text:
                  return 'SKIPPED'
              lines = [l for l in c_text.split('\n') if 'registry integrity:' in l and 'fetch:' not in l]
              if not lines:
                  return 'FAIL'
              return 'FAIL' if any('  FAIL  ' in l for l in lines) else 'PASS'

          def parse_tarball(text):
              m = re.search(r'\[C\].*?(?=\n\[[A-Z]\]|\Z)', text, re.DOTALL)
              if not m:
                  return 'FAIL'
              c_text = m.group(0)
              if 'SKIPPED' in c_text and '  PASS  ' not in c_text:
                  return 'SKIPPED'
              lines = [l for l in c_text.split('\n') if 'tarball sha256:' in l]
              if not lines:
                  return 'FAIL'
              return 'FAIL' if any('  FAIL  ' in l for l in lines) else 'PASS'

          try:
              audit = open('audit-output.txt').read()
          except Exception:
              audit = ''
          try:
              rehearsal = open('outsider-rehearsal-output.txt').read()
          except Exception:
              rehearsal = ''

          audit_ok = os.environ.get('AUDIT_OUTCOME') == 'success'
          rehearsal_ok = os.environ.get('REHEARSAL_OUTCOME') == 'success'

          d = {
              'format': 'if07c-release-candidate-verdict/v1',
              'candidate_sha': os.environ.get('CANDIDATE_SHA', ''),
              'intended_tag': os.environ.get('INTENDED_TAG', ''),
              'prepublish_audit': 'PASS' if audit_ok else 'FAIL',
              'outsider_rehearsal': 'PASS' if rehearsal_ok else 'FAIL',
              'manifest_closure': parse_section(audit, 'A'),
              'dependency_closure': parse_section(audit, 'B'),
              'registry_refetch': parse_registry(audit),
              'tarball_hashes': parse_tarball(audit),
              'negative_controls': parse_section(audit, 'G'),
          }

          # Runner claims are DERIVED from the candidate's
          # expected-results.json + fixture kinds (kind positive → PASS,
          # negative → BOUNDARY-HELD) and must show EXACT coverage in the
          # audit output: every expected verdict present and correct, none
          # missing, none duplicated, nothing extra. Replaces the hardcoded
          # 7-claim list.
          claims = {}
          try:
              expected = json.load(open('expected-results.json'))
              for cid, c in (expected.get('claims') or {}).items():
                  kind = json.load(open(c['fixture'])).get('kind')
                  claims[cid] = 'BOUNDARY-HELD' if kind == 'negative' else 'PASS'
          except Exception as e:
              print(f'claim derivation failed: {e}')

          observed = re.findall(r'^  PASS  verdict: (\S+) (\S+)$', audit, re.MULTILINE)
          observed_ids = [cid for cid, _ in observed]
          dup_ids = sorted({cid for cid in observed_ids if observed_ids.count(cid) > 1})
          missing = sorted(set(claims) - set(observed_ids))
          mismatched = sorted(cid for cid, v in claims.items() if (cid, v) not in observed)
          extra = sorted(set(observed_ids) - set(claims))

          d['runner_claims'] = {
              cid: ('PASS' if (cid, v) in observed and cid not in dup_ids else 'FAIL')
              for cid, v in sorted(claims.items())
          }
          d['runner_claims_coverage'] = {
              'expected_count': len(claims),
              'observed_count': len(observed_ids),
              'duplicate_ids': dup_ids,
              'missing': missing,
              'mismatched': mismatched,
              'extra': extra,
              'exact': (not missing and not mismatched and not extra and not dup_ids
                        and len(claims) > 0),
          }
          json.dump(d, open('release-candidate-verdict.json', 'w'), indent=2)
          print(json.dumps(d, indent=2))
          PYEOF

          if [[ "$AUDIT_OUTCOME" != "success" || "$REHEARSAL_OUTCOME" != "success" ]]; then
            echo ""
            echo "GATE FAILED — prepublish_audit=$AUDIT_OUTCOME  outsider_rehearsal=$REHEARSAL_OUTCOME"
            echo "Not authorized to tag ${{ github.event.inputs.intended_tag }}"
            exit 1
          fi
          echo ""
          echo "GATE PASSED — candidate ${{ github.event.inputs.candidate_sha }} authorized for tag ${{ github.event.inputs.intended_tag }}"
          echo "Next step: human review of artifacts, then manually create the tag"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-audit-${{ github.event.inputs.intended_tag }}
          retention-days: 90
          path: |
            candidate-identity.json
            release-candidate-verdict.json
            audit-output.txt
            outsider-rehearsal-output.txt
